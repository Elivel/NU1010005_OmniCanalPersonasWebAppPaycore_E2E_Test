serenity {
    encoding = "UTF-8"
    compress.filenames = true
    take.screenshots = FOR_EACH_ACTION
    step.delay=1000
    resized.image.width=600
    report.encoding=UTF-8
    report.accessibility = true
    report {
        accessibility = true
        tagtypes="capability,feature"
        show.step.details=true
    }
}

webdriver {
    driver = chrome
    autodownload = true
    acceptInsecureCerts = true
    capabilities {
        "goog:chromeOptions" {
            args = [
                "start-maximized", "test-type", "no-sandbox", "lang=es",
                "disable-popup-blocking", "disable-infobars", "disable-download-notification",
                "ignore-certificate-errors", "allow-running-insecure-content", "disable-translate",
                "always-authorize-plugins", "disable-extensions", "disable-gpu", "disable-default-apps",
                "remote-allow-origins=*"
            ]
            prefs {
                profile.default_content_settings.automatic_downloads = 1,
                download.prompt_for_download = false,
                default_content_settings.popups = 0,
                plugins.always_open_pdf_externally = true,
                download.default_directory = ${user.dir}
            }
        }
        "ms:edgeOptions" {
            args = [
                "start-maximized", "test-type", "lang=es", "ignore-certificate-errors",
                "--inprivate", "disable-infobars", "disable-gpu", "disable-default-apps",
                "disable-popup-blocking", "remote-allow-origins=*"
            ]
            prefs {
                profile.default_content_settings.automatic_downloads = 1,
                download.prompt_for_download = false,
                default_content_settings.popups = 0,
                plugins.always_open_pdf_externally = true
            }
        }
        "moz:firefoxOptions" {
            args = ["--window-size=1280,1024"]
            prefs {
                "javascript.options.showInConsole": false,
                "browser.download.folderList": 2
            }
            log { "level": "info" }
        }
    }
}

environments {
    qa {
        home.page = "https://ebancaqa1.banagricola.com"
    }
    dev {
        home.page = "https://ebancadesa1.banagricola.com"
    }
}
